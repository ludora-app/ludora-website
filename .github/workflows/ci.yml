name: CI Pipeline

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install

      - name: Typecheck
        run: pnpm ts:check --noEmit

      - name: Lint
        run: pnpm lint

      - name: Format Check
        run: pnpm format:check # ou pnpm format si vous voulez auto-fix

  translations:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ADMIN_PAT }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Doppler CLI
        run: |
          mkdir -p ~/.local/bin
          curl -Ls https://cli.doppler.com/install.sh | sh -s -- --install-path ~/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure Doppler
        run: doppler setup --token ${{ secrets.DOPPLER_TOKEN }}

      - run: pnpm install

      - run: pnpm load:translations

      - name: Commit and push translations
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add locales/

          # Vérifier s'il y a des changements
          if git diff --staged --quiet; then
            echo "✅ No translation changes to commit"
            exit 0
          fi

          git commit -m "chore(i18n): Auto-update translations [skip ci]"
          git push
