name: CI Pipeline

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - run: pnpm install
      - name: Typecheck
        run: pnpm ts:check --noEmit

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format

  translations:
    if: github.event_name == 'push' && contains('refs/heads/main refs/heads/staging refs/heads/develop', github.ref)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v2
      - name: Install Doppler CLI
        run: |
          mkdir -p ~/.local/bin
          curl -Ls https://cli.doppler.com/install.sh | sh -s -- --install-path ~/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Configure Doppler
        run: doppler setup --token ${{ secrets.DOPPLER_TOKEN }}
      - run: pnpm install
      - run: pnpm load:translations

      - name: Commit translations
        if: contains('refs/heads/main refs/heads/staging refs/heads/develop', github.ref)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions"
          git add locales/
          git commit -m "chore(i18n): Auto-update translations [skip ci]" || echo "Aucun changement"
          git push
