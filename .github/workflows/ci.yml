name: CI/CD Pipeline

on:
  push:
    branches: [main, staging, develop]

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    environment:
      name: >-
        ${{
          github.ref == 'refs/heads/main' && 'Production' ||
          github.ref == 'refs/heads/staging' && 'Staging' ||
          'Development'
        }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.ADMIN_PAT }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: 🔐 Install HashiCorp envconsul
        run: |
          sudo apt-get update && sudo apt-get install -y unzip
          wget https://releases.hashicorp.com/envconsul/0.13.4/envconsul_0.13.4_linux_amd64.zip
          unzip envconsul_0.13.4_linux_amd64.zip
          sudo mv envconsul /usr/local/bin/

      - run: pnpm install --frozen-lockfile

      # ── Generate ──────────────────────────────────────
      - name: 🌐 Load translations
        run: pnpm load:translations:local
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
          VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}

      - name: 🎨 Generate icons
        run: pnpm generate:icons

      # ── Checks ────────────────────────────────────────
      - run: pnpm ts:check
      - run: pnpm lint:fix
      - run: pnpm format --check

      # ── Release ───────────────────────────────────────
      - name: 📦 Semantic Release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.ADMIN_PAT }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

      - name: Get published version
        id: get-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if git describe --tags --exact-match >/dev/null 2>&1; then
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "📦 Published version: $VERSION"
          else
            echo "version=" >> $GITHUB_OUTPUT
            echo "⏭️ No new version published — skipping deploy"
          fi

      # ── Deploy (only if new version) ──────────────────
      - name: Install Vercel CLI
        if: steps.get-version.outputs.version != ''
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        if: steps.get-version.outputs.version != ''
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: >-
            ${{
              github.ref == 'refs/heads/main' && secrets.VERCEL_LUDORA_PROD_PROJECT_ID ||
              github.ref == 'refs/heads/staging' && secrets.VERCEL_LUDORA_STAGING_PROJECT_ID ||
              secrets.VERCEL_LUDORA_DEV_PROJECT_ID
            }}

      - name: Build Project Artifacts
        if: steps.get-version.outputs.version != ''
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: >-
            ${{
              github.ref == 'refs/heads/main' && secrets.VERCEL_LUDORA_PROD_PROJECT_ID ||
              github.ref == 'refs/heads/staging' && secrets.VERCEL_LUDORA_STAGING_PROJECT_ID ||
              secrets.VERCEL_LUDORA_DEV_PROJECT_ID
            }}
          NEXT_PUBLIC_APP_VERSION: ${{ steps.get-version.outputs.version }}
          NEXT_PUBLIC_ENV: >-
            ${{
              github.ref == 'refs/heads/main' && 'production' ||
              github.ref == 'refs/heads/staging' && 'staging' ||
              'development'
            }}

      - name: 🚀 Deploy to Vercel
        if: steps.get-version.outputs.version != ''
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "🚀 Deployed v${{ steps.get-version.outputs.version }} to $URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: >-
            ${{
              github.ref == 'refs/heads/main' && secrets.VERCEL_LUDORA_PROD_PROJECT_ID ||
              github.ref == 'refs/heads/staging' && secrets.VERCEL_LUDORA_STAGING_PROJECT_ID ||
              secrets.VERCEL_LUDORA_DEV_PROJECT_ID
            }}

  sync-branches:
    needs: [ci]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ADMIN_PAT }}
          fetch-depth: 0
      - name: Sync main → staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout staging
          git merge main --no-edit || true
          git push origin staging || true
      - name: Sync staging → develop
        run: |
          git checkout develop
          git merge staging --no-edit || true
          git push origin develop || true
